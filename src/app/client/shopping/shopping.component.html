<div class="shopping-container">
    <div class="header-section mb-5 d-flex justify-content-between align-items-center flex-wrap gap-4">
        <h2>Premium Selection</h2>

        <!-- Q8: Search by price UI -->
        <div class="search-box d-flex align-items-center gap-3">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-tag"></i> Min</span>
                <input type="number" class="form-control" [(ngModel)]="minPrice" placeholder="0">
            </div>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-tag-fill"></i> Max</span>
                <input type="number" class="form-control" [(ngModel)]="maxPrice" placeholder="99m">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary d-flex align-items-center gap-2" (click)="searchByPrice()">
                    <i class="bi bi-search"></i> Search
                </button>
                <button class="btn btn-outline-secondary" (click)="resetSearch()" title="Reset">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
            </div>
        </div>
    </div>

    <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Fetching premium products...</p>
    </div>

    <div *ngIf="error" class="alert alert-danger">
        {{ error }}
    </div>

    <div *ngIf="!loading && !error" class="row g-4">
        <div *ngIf="filteredProducts.length === 0" class="col-12 text-center py-5">
            <p class="text-muted">No products found in this price range.</p>
        </div>

        <div *ngFor="let product of filteredProducts" class="col-md-4 col-lg-3">
            <div class="product-card">
                <div class="img-container">
                    <img [src]="'assets/images/' + product.thumbnail" alt="{{product.product_name}}"
                        onerror="this.src='https://placehold.co/400x400?text=Product+Image'">
                    <div class="badge-bg">{{ product.made_by }}</div>
                </div>
                <div class="p-4 d-flex flex-column flex-grow-1">
                    <h5 class="product-title text-truncate" [title]="product.product_name">{{ product.product_name }}
                    </h5>
                    <p class="model-text"><i class="bi bi-cpu"></i> {{ product.model }}</p>

                    <div class="price-container d-flex justify-content-between align-items-center mt-3">
                        <span class="price text-primary fw-bold">{{ product.price | number:'1.0-0' }} VNĐ</span>
                        <div class="d-flex align-items-center gap-2">
                            <input type="number" class="form-control form-control-sm text-center" style="width: 60px;"
                                [(ngModel)]="quantities[product._id || 'temp']" [placeholder]="'1'" min="1">
                            <button class="btn buy-btn btn-sm d-flex align-items-center justify-content-center gap-2"
                                (click)="addToCart(product)">
                                <i class="bi bi-cart-plus"></i> Buy
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
